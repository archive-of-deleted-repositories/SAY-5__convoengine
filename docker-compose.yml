services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: convoengine
      POSTGRES_USER: convo
      POSTGRES_PASSWORD: convo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convo -d convoengine"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONVOENGINE_DB_URL: postgresql+psycopg://convo:convo@postgres:5432/convoengine
      CONVOENGINE_CONFIDENCE_FLOOR: "0.6"
      CONVOENGINE_VERY_LOW_FLOOR: "0.3"
      CONVOENGINE_OPERATOR_URL: "http://operator:9000/queue"
    ports:
      - "8000:8000"
