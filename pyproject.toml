[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "convoengine"
version = "0.1.0"
description = "Multi-channel conversational AI backend with per-conversation state and confidence-threshold fallback"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sai Asish Y" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.99",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
convoengine = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["convoengine"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require external services (postgres via testcontainers)",
    "bench: performance benchmarks",
]

[tool.coverage.run]
branch = true
source = ["convoengine"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
